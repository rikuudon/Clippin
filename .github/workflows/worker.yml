name: Clippin Worker

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL to process'
        required: true
        type: string
      whisper_model:
        description: 'Whisper model size'
        required: false
        default: 'base'
        type: choice
        options:
          - tiny
          - base
          - small

jobs:
  clip-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'worker/requirements.txt'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Run Clipping Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python worker/clipper.py --url "${{ inputs.video_url }}" --whisper-model "${{ inputs.whisper_model }}"

      - name: Upload Clips as Artifacts (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips-output
          path: output/
          retention-days: 7
